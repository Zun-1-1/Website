<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osmolska</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hero {
      position: relative;
    }

    .hero__img {
      width: 100%;
    }

    .ask {
      margin-top: calc(6 * var(--cm));
      padding-bottom: calc(6 * var(--cm));
      text-align: center;
    }

    .ask__title {
      margin: 0 calc(1 * var(--cm));
      font-size: 5rem;
      font-weight: normal;
    }

    .ask__choices {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: calc(4 * var(--cm));
      margin-top: calc(2 * var(--cm));
    }

    .ask__or {
      font-size: 3rem;
    }

    .ask__link {
      padding: 10px 30px;
      border: 0;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.7);
      color: #000;
      font: inherit;
      font-size: 3rem;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
    }

    @media (max-width: 700px), (max-height: 520px) {

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .hero {
        flex: 1;
        overflow: hidden;
        min-height: 160px;
      }

      .hero__img {
        position: absolute;
        top: 0;
        left: 0;
        width: calc(100% + 10 * var(--cm));
        height: 100%;
        margin-left: calc(-9 * var(--cm));
        object-fit: cover;
        object-position: center;
      }

      .ask {
        position: absolute;
        top: 50%;
        left: 0;
        z-index: 1;
        width: 100%;
        margin: 0;
        padding: 0;
        transform: translateY(-50%);
      }

      .ask__title {
        font-size: 11vw;
        font-weight: bold;
        color: #fff;
      }

      .ask__choices {
        gap: calc(0.7 * var(--cm));
      }

      .ask__or {
        color: #fff;
        font-size: 5.8vw;
      }

      .ask__link {
        padding: 7px 12px;
        border-radius: 14px;
        font-size: 5.8vw;
      }
    }
  </style>
</head>
<body>
  <header class="banner">
    <a class="banner__title" href="index.html">Osmolska</a>
  </header>

  <main class="hero">
    <img class="hero__img" src="Images/Presentation.png"
         alt="A collage of the work behind Osmolska">

    <div class="ask">
      <h2 class="ask__title">Are you here for</h2>
      <div class="ask__choices">
        <a class="ask__link" href="science.html">the Science</a>
        <span class="ask__or">or</span>
        <a class="ask__link" href="art.html">the Art?</a>
      </div>
    </div>
  </main>
</body>
</html>
